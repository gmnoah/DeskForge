name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npm --prefix independent test
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Install browser for UI regression tests
        run: pnpm --filter @deskforge/desktop exec playwright install --with-deps chromium
      - run: pnpm --filter @deskforge/desktop test:review
      - run: pnpm build
      - run: pnpm check:size
      - name: Configure Electron sandbox on Linux
        working-directory: apps/desktop
        run: |
          sandbox_path="$(node -p "require('node:path').join(require('node:path').dirname(require('electron')), 'chrome-sandbox')")"
          test -f "$sandbox_path"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
      - name: Smoke test with virtual display
        run: xvfb-run -a pnpm smoke
