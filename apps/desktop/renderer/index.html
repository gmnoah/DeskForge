<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeskForge</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="mark">DeskForge</p>
        <p class="tag">本地工作台 · macOS P0</p>
      </div>
      <p id="status" class="status">正在连接主进程</p>
    </header>
    <div class="layout">
      <aside class="sessions">
        <button id="new-session" type="button">新的工作</button>
        <ul id="session-list"></ul>
      </aside>
      <main class="work">
        <ol id="messages"></ol>
        <form id="composer">
          <textarea id="prompt" rows="3" placeholder="说明你要做的事。文件和命令会先经过批准。"></textarea>
          <div class="composer-row">
            <p id="hint">工作区里的读取可以直接进行。写入和 Shell 会停下来等你点头。</p>
            <button id="send" type="submit">发送</button>
          </div>
        </form>
      </main>
      <aside class="side">
        <section>
          <h2>工作区</h2>
          <p id="workspace" class="path">还没有选择。不会默认使用 /。</p>
          <button id="choose-workspace" type="button">选择文件夹</button>
        </section>
        <section>
          <h2>模型</h2>
          <form id="settings">
            <label>预设<select id="preset"></select></label>
            <label>baseUrl<input id="base-url" type="url" spellcheck="false" /></label>
            <label>模型<input id="model" type="text" spellcheck="false" /></label>
            <label>API key<input id="api-key" type="password" autocomplete="off" placeholder="只留在本次进程内存" /></label>
            <p id="key-state" class="muted"></p>
            <button type="submit">保存模型</button>
          </form>
        </section>
        <section>
          <h2>待批准</h2>
          <div id="approvals" class="stack"></div>
        </section>
        <section>
          <h2>审计</h2>
          <p id="audit-ok" class="muted"></p>
          <ol id="audit" class="audit"></ol>
        </section>
      </aside>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
